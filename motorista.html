<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Simples - Motorista</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topo">
    <span style="display:flex; align-items:center; gap:10px;">
      <img src="assets/logo.png" alt="Logo" class="logo-topo">
      <span id="tituloTopo">Rota Simples</span>
    </span>
    <span style="display:flex; align-items:center; gap:16px;">
      <span id="nomeUsuarioLogado" style="font-weight:600; opacity:0.9;"></span>
      <span class="sair" onclick="encerrarSessao()">Sair</span>
    </span>
  </div>

  <div class="container">

    <!-- ==================== TELA: LISTA DE ROTAS + FILTRO POR DIA ==================== -->
    <div id="telaListaRotas">
      <div class="card">
        <label>Ver rotas do dia</label>
        <input type="date" id="filtroData">
      </div>
      <div id="listaRotasDoDia"></div>
    </div>

    <!-- ==================== TELA: PEDIDOS DE UMA ROTA ==================== -->
    <div id="telaPedidos" style="display:none;">
      <button class="btn-secundario" style="width:auto; padding:8px 16px; margin-bottom:12px;" onclick="voltarParaListaRotas()">← Voltar</button>
      <div class="card" id="resumoRotaAberta"></div>
      <div id="listaPedidos"></div>
      <button class="btn-primario" id="btnFinalizarRota" style="background:var(--indigo);" onclick="finalizarRota()">Finalizar Rota</button>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    // Limpeza de qualquer resquício de uma versão anterior com fila offline
    // (Service Worker, cache e IndexedDB) — não é mais usado neste sistema.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then(nomes => nomes.forEach(n => caches.delete(n)));
    }
    if (window.indexedDB && indexedDB.deleteDatabase) {
      indexedDB.deleteDatabase('rota_simples_db');
    }

    const sessao = exigirSessao('MOTORISTA');
    document.getElementById('nomeUsuarioLogado').textContent = sessao ? sessao.usuario : '';

    function gerarUUID() {
      if (crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // Sempre usar esta função pra registrar evento — já injeta o uuid
    // (evita duplicar se der duplo clique) e o usuário logado (auditoria).
    function registrarEventoComAuditoria(dadosEvento) {
      return chamarAPI('registrarEvento', {
        eventoUuid: gerarUUID(),
        usuario: sessao.usuario,
        ...dadosEvento
      });
    }

    let rotasDoMotorista = [];
    let rotaAberta = null;
    let pedidos = [];

    function hojeISO() {
      return new Date().toISOString().split('T')[0];
    }

    function formatarDataBR(dataStr) {
      const partes = String(dataStr).slice(0, 10).split('-');
      if (partes.length !== 3) return dataStr;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    document.getElementById('filtroData').value = hojeISO();
    document.getElementById('filtroData').addEventListener('change', renderizarListaRotas);

    async function carregarRotas() {
      try {
        const resp = await chamarAPI('listarRotasAtivas', {});
        rotasDoMotorista = (resp.rotas || []).filter(r => r.motorista === sessao.usuario && r.statusGeral !== 'CANCELADA');
        renderizarListaRotas();
      } catch (e) {
        document.getElementById('listaRotasDoDia').innerHTML =
          '<div class="card"><p class="erro-msg">Sem conexão. Verifique o sinal e toque em Atualizar.</p>' +
          '<button class="btn-secundario" onclick="carregarRotas()">Atualizar</button></div>';
      }
    }

    function statusParaClasse(status) {
      return String(status).toLowerCase();
    }

    function renderizarListaRotas() {
      const dataFiltro = document.getElementById('filtroData').value;
      const doDia = rotasDoMotorista.filter(r => String(r.data).slice(0, 10) === dataFiltro);
      const div = document.getElementById('listaRotasDoDia');

      if (doDia.length === 0) {
        div.innerHTML = '<div class="card" style="text-align:center;"><p>Nenhuma rota atribuída pra esse dia.</p></div>';
        return;
      }

      div.innerHTML = doDia.map(r => {
        const totalConcluido = r.entregues + r.naoEntregues;
        const pct = r.totalPedidos ? Math.round((totalConcluido / r.totalPedidos) * 100) : 0;
        return `
        <div class="linha-rota">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>Rota ${r.idRota}</strong>
              <p style="margin:4px 0 0; font-size:13px; color:#666;">${formatarDataBR(r.data)} · ${r.veiculo} · ${r.totalPedidos} pedidos</p>
            </div>
            <span class="status-pill ${statusParaClasse(r.statusGeral)}">${r.statusGeral.replace('_',' ')}</span>
          </div>
          ${r.statusGeral !== 'NAO_INICIADA' ? `
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              <span style="font-size:12px; color:#666; white-space:nowrap;">${totalConcluido}/${r.totalPedidos}</span>
            </div>
          ` : ''}
          <div style="margin-top:12px;">${botaoParaRota(r)}</div>
        </div>
      `;
      }).join('');
    }

    function botaoParaRota(r) {
      if (r.statusGeral === 'NAO_INICIADA') {
        return `<button class="btn-primario" onclick='abrirRota(${JSON.stringify(r)})'>Iniciar Rota</button>`;
      }
      if (r.statusGeral === 'EM_ANDAMENTO') {
        return `<button class="btn-primario" style="background:var(--indigo);" onclick='abrirRota(${JSON.stringify(r)})'>Continuar rota</button>`;
      }
      return `<button class="btn-secundario" onclick='abrirRota(${JSON.stringify(r)})'>Ver detalhes (finalizada)</button>`;
    }

    async function abrirRota(rota) {
      if (rota.statusGeral === 'NAO_INICIADA') {
        const uuidFake = null; // sem uso, mantido só por clareza no fluxo
        const agora = new Date().toISOString();
        try {
          const resp = await registrarEventoComAuditoria({
            idRota: rota.idRota, tipoEvento: 'INICIAR_ROTA', timestampDispositivo: agora
          });
          if (!resp.ok) { alert(resp.erro || 'Não consegui iniciar a rota. Tente de novo.'); return; }
          rota.statusGeral = 'EM_ANDAMENTO';
        } catch (e) {
          alert('Sem conexão. Verifique o sinal e tente novamente.');
          return;
        }
      }

      rotaAberta = rota;
      await carregarPedidosDaRota();
    }

    async function carregarPedidosDaRota() {
      try {
        const resp = await chamarAPI('listarPedidosDaRota', { idRota: rotaAberta.idRota });
        pedidos = resp.pedidos || [];
        renderizarTelaPedidos();
      } catch (e) {
        alert('Sem conexão. Verifique o sinal e tente novamente.');
      }
    }

    function renderizarTelaPedidos() {
      document.getElementById('telaListaRotas').style.display = 'none';
      document.getElementById('telaPedidos').style.display = 'block';
      document.getElementById('tituloTopo').textContent = 'Rota ' + rotaAberta.idRota;

      const somenteLeitura = rotaAberta.statusGeral === 'FINALIZADA';
      const entregues = pedidos.filter(p => p.STATUS === 'ENTREGUE').length;
      const naoEntregues = pedidos.filter(p => p.STATUS === 'NAO_ENTREGUE').length;
      const pct = pedidos.length ? Math.round(((entregues + naoEntregues) / pedidos.length) * 100) : 0;

      document.getElementById('resumoRotaAberta').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span><strong>Data:</strong> ${formatarDataBR(rotaAberta.data)} &nbsp;·&nbsp; <strong>Veículo:</strong> ${rotaAberta.veiculo}</span>
          <span class="status-pill ${statusParaClasse(rotaAberta.statusGeral)}">${rotaAberta.statusGeral.replace('_',' ')}</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
          <span style="font-size:12px; color:#666; white-space:nowrap;">${entregues + naoEntregues}/${pedidos.length}</span>
        </div>
        ${somenteLeitura ? '<p style="margin:10px 0 0; color:var(--sucesso); font-weight:700;">✓ Rota finalizada — somente visualização</p>' : ''}
      `;

      document.getElementById('btnFinalizarRota').style.display = somenteLeitura ? 'none' : 'block';
      renderizarPedidos();
    }

    function voltarParaListaRotas() {
      rotaAberta = null;
      document.getElementById('telaPedidos').style.display = 'none';
      document.getElementById('telaListaRotas').style.display = 'block';
      document.getElementById('tituloTopo').textContent = 'Rota Simples';
      carregarRotas();
    }

    async function finalizarRota() {
      if (!confirm('Finalizar a rota e registrar o horário de volta ao CD agora? Depois disso não será mais possível editar as entregas.')) return;
      const agora = new Date().toISOString();
      try {
        const resp = await registrarEventoComAuditoria({
          idRota: rotaAberta.idRota, tipoEvento: 'FINALIZAR_ROTA', timestampDispositivo: agora
        });
        if (!resp.ok) { alert(resp.erro || 'Não consegui finalizar a rota. Tente de novo.'); return; }
        rotaAberta.statusGeral = 'FINALIZADA';
        renderizarTelaPedidos();
        alert('Rota finalizada. Bom descanso!');
      } catch (e) {
        alert('Sem conexão. Verifique o sinal e tente novamente.');
      }
    }

    function renderizarPedidos() {
      const lista = document.getElementById('listaPedidos');
      lista.innerHTML = pedidos.map(p => cardPedido(p)).join('');
    }

    function badgeClasse(status) {
      return { PENDENTE: 'pendente', EM_ENTREGA: 'em_entrega', ENTREGUE: 'entregue', NAO_ENTREGUE: 'nao_entregue' }[status] || 'pendente';
    }

    function cardPedido(p) {
      const somenteLeitura = rotaAberta.statusGeral === 'FINALIZADA';
      return `
        <div class="pedido-item" id="pedido_${p.ID_PEDIDO}">
          <span class="badge ${badgeClasse(p.STATUS)}" style="float:right;">${p.STATUS.replace('_',' ')}</span>
          <h3>Pedido ${p.NUMERO_PEDIDO}</h3>
          <p>${p.CLIENTE}</p>
          <p>${p.ENDERECO}</p>
          ${p.MOTIVO_NAO_ENTREGUE ? `<p><strong>Motivo:</strong> ${p.MOTIVO_NAO_ENTREGUE}</p>` : ''}
          ${p.TEM_OCORRENCIA === 'SIM' ? `<p><strong>Ocorrência:</strong> ${p.OBSERVACAO_OCORRENCIA || ''}</p>` : ''}
          <div id="acoes_${p.ID_PEDIDO}" style="margin-top:10px;">
            ${somenteLeitura ? '' : botoesParaStatus(p)}
          </div>
        </div>
      `;
    }

    function botoesParaStatus(p) {
      if (p.STATUS === 'PENDENTE') {
        return `<button class="btn-secundario" onclick="entregaIniciada('${p.ID_PEDIDO}')">Iniciar entrega</button>`;
      }
      if (p.STATUS === 'EM_ENTREGA') {
        return `
          <div class="grid-2">
            <button class="btn-secundario" style="color:var(--sucesso); border-color:var(--sucesso)!important;" onclick="abrirFluxoEntregue('${p.ID_PEDIDO}')">Entrega finalizada</button>
            <button class="btn-secundario" style="color:var(--erro); border-color:var(--erro)!important;" onclick="abrirFluxoNaoRealizada('${p.ID_PEDIDO}')">Entrega não realizada</button>
          </div>
          <div id="fluxo_${p.ID_PEDIDO}"></div>
        `;
      }
      return '<p style="font-size:12px; color:#999;">Concluído.</p>';
    }

    async function entregaIniciada(idPedido) {
      const agora = new Date().toISOString();
      try {
        const resp = await registrarEventoComAuditoria({
          idRota: rotaAberta.idRota, idPedido, tipoEvento: 'ENTREGA_INICIADA', timestampDispositivo: agora
        });
        if (!resp.ok) { alert(resp.erro || 'Não consegui registrar. Tente de novo.'); return; }
        const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
        p.STATUS = 'EM_ENTREGA';
        document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      } catch (e) {
        alert('Sem conexão. Verifique o sinal e tente novamente.');
      }
    }

    function abrirFluxoEntregue(idPedido) {
      const div = document.getElementById(`fluxo_${idPedido}`);
      div.innerHTML = `
        <div class="card" style="margin-top:10px;">
          <label>Anexo (opcional — foto como comprovante da entrega)</label>
          <input type="file" id="anexoEntrega_${idPedido}" accept="image/*" capture="environment" multiple onchange="mostrarPreviewAnexos('${idPedido}')">
          <div id="previewAnexos_${idPedido}" class="grid-2" style="margin-top:8px;"></div>

          <label style="margin-top:16px;">Ocorrência na entrega?</label>
          <div class="grid-2">
            <button class="btn-secundario" onclick="marcarSemOcorrencia('${idPedido}')">Não</button>
            <button class="btn-secundario" style="color:var(--alerta); border-color:var(--alerta)!important;" onclick="mostrarCamposOcorrencia('${idPedido}')">Sim</button>
          </div>
          <div id="camposOcorrencia_${idPedido}"></div>
        </div>
      `;
    }

    // Guarda os anexos já comprimidos em memória (por pedido), pra mostrar
    // preview visual e só enviar de fato quando o motorista confirmar.
    const anexosPendentesPorPedido = {};

    async function mostrarPreviewAnexos(idPedido) {
      const inputFoto = document.getElementById(`anexoEntrega_${idPedido}`);
      const previewDiv = document.getElementById(`previewAnexos_${idPedido}`);
      anexosPendentesPorPedido[idPedido] = [];
      previewDiv.innerHTML = '<p style="font-size:12px; color:#999;">Preparando prévia...</p>';

      const base64s = [];
      for (const arquivo of inputFoto.files) {
        base64s.push(await comprimirImagemParaBase64(arquivo));
      }
      anexosPendentesPorPedido[idPedido] = base64s;

      previewDiv.innerHTML = base64s.map((b64, idx) => `
        <div style="position:relative;">
          <img src="data:image/jpeg;base64,${b64}" style="width:100%; border-radius:10px; border:1px solid var(--cinza-borda);">
          <button type="button" onclick="removerAnexo('${idPedido}', ${idx})" style="position:absolute; top:4px; right:4px; background:var(--erro); color:#fff; border-radius:50%; width:24px; height:24px; font-size:12px; padding:0;">✕</button>
        </div>
      `).join('') || '<p style="font-size:12px; color:#999;">Nenhum anexo selecionado.</p>';
    }

    function removerAnexo(idPedido, indice) {
      anexosPendentesPorPedido[idPedido].splice(indice, 1);
      // Reconstrói a prévia sem o item removido, sem precisar reabrir o seletor de arquivo
      const previewDiv = document.getElementById(`previewAnexos_${idPedido}`);
      previewDiv.innerHTML = anexosPendentesPorPedido[idPedido].map((b64, idx) => `
        <div style="position:relative;">
          <img src="data:image/jpeg;base64,${b64}" style="width:100%; border-radius:10px; border:1px solid var(--cinza-borda);">
          <button type="button" onclick="removerAnexo('${idPedido}', ${idx})" style="position:absolute; top:4px; right:4px; background:var(--erro); color:#fff; border-radius:50%; width:24px; height:24px; font-size:12px; padding:0;">✕</button>
        </div>
      `).join('') || '<p style="font-size:12px; color:#999;">Nenhum anexo selecionado.</p>';
    }

    async function enviarAnexosPendentes(idPedido) {
      const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
      const anexos = anexosPendentesPorPedido[idPedido] || [];
      for (const base64 of anexos) {
        const respFoto = await chamarAPI('uploadFoto', {
          idPedido, numeroPedido: p.NUMERO_PEDIDO, base64Data: base64, mimeType: 'image/jpeg'
        });
        if (!respFoto.ok) alert('Aviso: um anexo não foi enviado (' + (respFoto.erro || 'erro') + '), mas a entrega será concluída.');
      }
      delete anexosPendentesPorPedido[idPedido];
    }

    function mostrarCamposOcorrencia(idPedido) {
      const div = document.getElementById(`camposOcorrencia_${idPedido}`);
      div.innerHTML = `
        <label>Descreva a ocorrência (o quê e quantos produtos avariados)</label>
        <textarea id="obsOcorrencia_${idPedido}"></textarea>
        <button class="btn-primario" id="btnConfirmarOcorrencia_${idPedido}" onclick="confirmarComOcorrencia('${idPedido}')">Finalizar com ocorrência</button>
      `;
    }

    async function marcarSemOcorrencia(idPedido) {
      await enviarAnexosPendentes(idPedido);
      await concluirPedido(idPedido, { temOcorrencia: false });
    }

    async function confirmarComOcorrencia(idPedido) {
      const btn = document.getElementById(`btnConfirmarOcorrencia_${idPedido}`);
      const obs = document.getElementById(`obsOcorrencia_${idPedido}`).value.trim();

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        await enviarAnexosPendentes(idPedido);
        await concluirPedido(idPedido, { temOcorrencia: true, observacaoOcorrencia: obs });
      } finally {
        btn.disabled = false;
        btn.textContent = 'Finalizar com ocorrência';
      }
    }

    async function concluirPedido(idPedido, { temOcorrencia, observacaoOcorrencia }) {
      try {
        const resp1 = await chamarAPI('atualizarStatusPedido', {
          idPedido, status: 'ENTREGUE', temOcorrencia, observacaoOcorrencia: observacaoOcorrencia || ''
        });
        if (!resp1.ok) { alert(resp1.erro || 'Não consegui atualizar o pedido.'); return; }

        const agora = new Date().toISOString();
        await registrarEventoComAuditoria({
          idRota: rotaAberta.idRota, idPedido, tipoEvento: 'PEDIDO_ENTREGUE', timestampDispositivo: agora
        });

        const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
        p.STATUS = 'ENTREGUE';
        p.TEM_OCORRENCIA = temOcorrencia ? 'SIM' : 'NAO';
        p.OBSERVACAO_OCORRENCIA = observacaoOcorrencia || '';
        document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      } catch (e) {
        alert('Sem conexão. Verifique o sinal e tente novamente.');
      }
    }

    function abrirFluxoNaoRealizada(idPedido) {
      const div = document.getElementById(`fluxo_${idPedido}`);
      const motivos = ['Cliente ausente', 'Fora do Horário', 'Pedido Errado', 'Recusado pelo cliente', 'Outros'];
      div.innerHTML = `
        <div class="card" style="margin-top:10px;">
          <label>Motivo</label>
          <select id="motivoSelect_${idPedido}" onchange="alternarCampoOutros('${idPedido}')">
            ${motivos.map(m => `<option value="${m}">${m}</option>`).join('')}
          </select>
          <div id="campoOutros_${idPedido}" style="display:none;">
            <label>Descreva o motivo</label>
            <input type="text" id="motivoOutros_${idPedido}">
          </div>
          <button class="btn-primario" id="btnConfirmarNaoEntregue_${idPedido}" onclick="confirmarNaoEntregue('${idPedido}')">Confirmar</button>
        </div>
      `;
    }

    function alternarCampoOutros(idPedido) {
      const select = document.getElementById(`motivoSelect_${idPedido}`);
      document.getElementById(`campoOutros_${idPedido}`).style.display = select.value === 'Outros' ? 'block' : 'none';
    }

    async function confirmarNaoEntregue(idPedido) {
      const btn = document.getElementById(`btnConfirmarNaoEntregue_${idPedido}`);
      const select = document.getElementById(`motivoSelect_${idPedido}`);
      let motivo = select.value;
      if (motivo === 'Outros') {
        motivo = document.getElementById(`motivoOutros_${idPedido}`).value.trim() || 'Outros';
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const resp1 = await chamarAPI('atualizarStatusPedido', { idPedido, status: 'NAO_ENTREGUE', motivoNaoEntregue: motivo });
        if (!resp1.ok) { alert(resp1.erro || 'Não consegui atualizar o pedido.'); return; }

        const agora = new Date().toISOString();
        await registrarEventoComAuditoria({
          idRota: rotaAberta.idRota, idPedido, tipoEvento: 'PEDIDO_NAO_ENTREGUE', timestampDispositivo: agora, detalhe: { motivo }
        });

        const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
        p.STATUS = 'NAO_ENTREGUE';
        p.MOTIVO_NAO_ENTREGUE = motivo;
        document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      } catch (e) {
        alert('Sem conexão. Verifique o sinal e tente novamente.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirmar';
      }
    }

    // Redimensiona pra no máx. 1024px de largura e comprime em JPEG 70%
    function comprimirImagemParaBase64(arquivo) {
      return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const escala = Math.min(1, 1024 / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * escala;
            canvas.height = img.height * escala;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl.split(',')[1]);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        leitor.onerror = reject;
        leitor.readAsDataURL(arquivo);
      });
    }

    carregarRotas();
  </script>
</body>
</html>
