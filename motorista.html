<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Simples - Motorista</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topo">
    <span style="display:flex; align-items:center; gap:10px;">
      <img src="assets/logo.png" alt="Logo" class="logo-topo">
      <span id="tituloTopo">Rota Simples</span>
    </span>
    <span style="display:flex; align-items:center; gap:16px;">
      <span id="nomeUsuarioLogado" style="font-weight:600; opacity:0.9;"></span>
      <span class="sair" onclick="encerrarSessao()">Sair</span>
    </span>
  </div>

  <div class="container">
    <div id="telaSemRota" class="card" style="text-align:center; display:none;">
      <p>Nenhuma rota atribuída pra hoje ainda.</p>
      <button class="btn-secundario" onclick="carregarRota()">Atualizar</button>
    </div>

    <div id="telaIniciar" class="card" style="text-align:center; display:none;">
      <h2 style="color:var(--indigo); font-family:'Montserrat',sans-serif;">Rota <span id="idRotaLabel"></span></h2>
      <p><strong>Data da rota:</strong> <span id="dataRotaLabel"></span></p>
      <p><span id="veiculoLabel"></span></p>
      <p><span id="qtdPedidosLabel"></span> pedidos</p>
      <button class="btn-primario" onclick="iniciarRota()">Iniciar Rotas</button>
    </div>

    <div id="telaPedidos" style="display:none;">
      <button class="btn-secundario" style="width:auto; padding:8px 16px; margin-bottom:12px;" onclick="voltarParaTelaIniciar()">← Voltar</button>
      <div id="listaPedidos"></div>
      <button class="btn-primario" onclick="finalizarRota()" style="background:var(--indigo);">Finalizar Rota</button>
    </div>
  </div>

  <div id="faixaSync" class="faixa-sync"></div>

  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script>
    const sessao = exigirSessao('MOTORISTA');
    document.getElementById('nomeUsuarioLogado').textContent = sessao ? sessao.usuario : '';
    let rotaAtual = null;
    let pedidos = [];

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    async function carregarRota() {
      try {
        const resp = await chamarAPI('listarRotasAtivas', {});
        const hoje = new Date().toISOString().split('T')[0];
        const minhas = (resp.rotas || []).filter(r =>
          r.motorista === sessao.usuario &&
          r.statusGeral !== 'FINALIZADA' &&
          String(r.data).slice(0, 10) === hoje
        );
        if (minhas.length === 0) { mostrarTela('semRota'); return; }

        rotaAtual = minhas[0];
        const pedidosResp = await chamarAPI('listarPedidosDaRota', { idRota: rotaAtual.idRota });
        pedidos = pedidosResp.pedidos || [];
        await salvarCacheRota(rotaAtual.idRota, { rotaAtual, pedidos });
        renderizar();
      } catch (e) {
        // sem sinal: tenta cache local
        const chaves = await listarCachesDisponiveis();
        if (chaves.length) {
          const dados = await lerCacheRota(chaves[0]);
          rotaAtual = dados.rotaAtual;
          pedidos = dados.pedidos;
          renderizar();
        } else {
          mostrarTela('semRota');
        }
      }
    }

    async function listarCachesDisponiveis() {
      // fallback simples: como só existe 1 rota ativa por vez no fluxo do motorista,
      // tentamos usar o idRota guardado na última sessão bem-sucedida.
      const ultimo = localStorage.getItem('rota_simples_ultimo_idrota');
      return ultimo ? [ultimo] : [];
    }

    function renderizar() {
      if (!rotaAtual) { mostrarTela('semRota'); return; }
      localStorage.setItem('rota_simples_ultimo_idrota', rotaAtual.idRota);
      document.getElementById('tituloTopo').textContent = 'Rota ' + rotaAtual.idRota + ' — ' + formatarDataBR(rotaAtual.data);

      if (rotaAtual.statusGeral === 'NAO_INICIADA') {
        document.getElementById('idRotaLabel').textContent = rotaAtual.idRota;
        document.getElementById('dataRotaLabel').textContent = formatarDataBR(rotaAtual.data);
        document.getElementById('veiculoLabel').textContent = rotaAtual.veiculo;
        document.getElementById('qtdPedidosLabel').textContent = pedidos.length;
        mostrarTela('iniciar');
      } else {
        renderizarPedidos();
        mostrarTela('pedidos');
      }
    }

    function formatarDataBR(dataStr) {
      const partes = String(dataStr).slice(0, 10).split('-');
      if (partes.length !== 3) return dataStr;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function voltarParaTelaIniciar() {
      // Navegação simples pra revisar a tela anterior — não cancela
      // o início da rota que já foi registrado no servidor.
      mostrarTela('iniciar');
    }

    function mostrarTela(nome) {
      document.getElementById('telaSemRota').style.display = nome === 'semRota' ? 'block' : 'none';
      document.getElementById('telaIniciar').style.display = nome === 'iniciar' ? 'block' : 'none';
      document.getElementById('telaPedidos').style.display = nome === 'pedidos' ? 'block' : 'none';
    }

    async function iniciarRota() {
      const uuid = gerarUUID();
      const agora = new Date().toISOString();
      await enfileirarEvento({
        uuid, action: 'registrarEvento',
        payload: { eventoUuid: uuid, idRota: rotaAtual.idRota, tipoEvento: 'INICIAR_ROTA', timestampDispositivo: agora }
      });
      rotaAtual.statusGeral = 'EM_ANDAMENTO';
      renderizarPedidos();
      mostrarTela('pedidos');
      sincronizarFila();
    }

    async function finalizarRota() {
      if (!confirm('Finalizar a rota e registrar o horário de volta ao CD agora?')) return;
      const uuid = gerarUUID();
      const agora = new Date().toISOString();
      await enfileirarEvento({
        uuid, action: 'registrarEvento',
        payload: { eventoUuid: uuid, idRota: rotaAtual.idRota, tipoEvento: 'FINALIZAR_ROTA', timestampDispositivo: agora }
      });
      sincronizarFila();
      alert('Rota finalizada. Bom descanso!');
      location.reload();
    }

    function renderizarPedidos() {
      const lista = document.getElementById('listaPedidos');
      lista.innerHTML = pedidos.map(p => cardPedido(p)).join('');
    }

    function badgeClasse(status) {
      return { PENDENTE: 'pendente', EM_ENTREGA: 'em_entrega', ENTREGUE: 'entregue', NAO_ENTREGUE: 'nao_entregue' }[status] || 'pendente';
    }

    function cardPedido(p) {
      return `
        <div class="pedido-item" id="pedido_${p.ID_PEDIDO}">
          <span class="badge ${badgeClasse(p.STATUS)}" style="float:right;">${p.STATUS.replace('_',' ')}</span>
          <h3>Pedido ${p.NUMERO_PEDIDO}</h3>
          <p>${p.CLIENTE}</p>
          <p>${p.ENDERECO}</p>
          <div id="acoes_${p.ID_PEDIDO}" style="margin-top:10px;">
            ${botoesParaStatus(p)}
          </div>
        </div>
      `;
    }

    function botoesParaStatus(p) {
      if (p.STATUS === 'PENDENTE') {
        return `<button class="btn-secundario" onclick="entregaIniciada('${p.ID_PEDIDO}')">Iniciar entrega</button>`;
      }
      if (p.STATUS === 'EM_ENTREGA') {
        return `
          <div class="grid-2">
            <button class="btn-secundario" style="color:var(--sucesso); border-color:var(--sucesso)!important;" onclick="abrirFluxoEntregue('${p.ID_PEDIDO}')">Entrega finalizada</button>
            <button class="btn-secundario" style="color:var(--erro); border-color:var(--erro)!important;" onclick="abrirFluxoNaoRealizada('${p.ID_PEDIDO}')">Entrega não realizada</button>
          </div>
          <div id="fluxo_${p.ID_PEDIDO}"></div>
        `;
      }
      return '<p style="font-size:12px; color:#999;">Concluído.</p>';
    }

    async function entregaIniciada(idPedido) {
      const uuid = gerarUUID();
      const agora = new Date().toISOString();
      await enfileirarEvento({
        uuid, action: 'registrarEvento',
        payload: { eventoUuid: uuid, idRota: rotaAtual.idRota, idPedido, tipoEvento: 'ENTREGA_INICIADA', timestampDispositivo: agora }
      });
      const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
      p.STATUS = 'EM_ENTREGA';
      document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      sincronizarFila();
    }

    function abrirFluxoEntregue(idPedido) {
      const div = document.getElementById(`fluxo_${idPedido}`);
      div.innerHTML = `
        <div class="card" style="margin-top:10px;">
          <label>Ocorrência na entrega?</label>
          <div class="grid-2">
            <button class="btn-secundario" onclick="marcarSemOcorrencia('${idPedido}')">Não</button>
            <button class="btn-secundario" style="color:var(--alerta); border-color:var(--alerta)!important;" onclick="mostrarCamposOcorrencia('${idPedido}')">Sim</button>
          </div>
          <div id="camposOcorrencia_${idPedido}"></div>
        </div>
      `;
    }

    function mostrarCamposOcorrencia(idPedido) {
      const div = document.getElementById(`camposOcorrencia_${idPedido}`);
      div.innerHTML = `
        <label>Descreva a ocorrência (o quê e quantos produtos avariados)</label>
        <textarea id="obsOcorrencia_${idPedido}"></textarea>
        <label>Fotos (opcional)</label>
        <input type="file" id="fotoOcorrencia_${idPedido}" accept="image/*" capture="environment" multiple>
        <button class="btn-primario" onclick="confirmarComOcorrencia('${idPedido}')">Finalizar com ocorrência</button>
      `;
    }

    async function marcarSemOcorrencia(idPedido) {
      await concluirPedido(idPedido, { temOcorrencia: false });
    }

    async function confirmarComOcorrencia(idPedido) {
      const obs = document.getElementById(`obsOcorrencia_${idPedido}`).value.trim();
      const inputFoto = document.getElementById(`fotoOcorrencia_${idPedido}`);
      const p = pedidos.find(x => x.ID_PEDIDO === idPedido);

      if (inputFoto.files && inputFoto.files.length) {
        for (const arquivo of inputFoto.files) {
          const base64 = await comprimirImagemParaBase64(arquivo);
          const uuid = gerarUUID();
          await enfileirarEvento({
            uuid, action: 'uploadFoto',
            payload: { idPedido, numeroPedido: p.NUMERO_PEDIDO, base64Data: base64, mimeType: 'image/jpeg' }
          });
        }
      }

      await concluirPedido(idPedido, { temOcorrencia: true, observacaoOcorrencia: obs });
    }

    async function concluirPedido(idPedido, { temOcorrencia, observacaoOcorrencia }) {
      const uuidStatus = gerarUUID();
      await enfileirarEvento({
        uuid: uuidStatus, action: 'atualizarStatusPedido',
        payload: { idPedido, status: 'ENTREGUE', temOcorrencia, observacaoOcorrencia: observacaoOcorrencia || '' }
      });

      const uuidEvento = gerarUUID();
      const agora = new Date().toISOString();
      await enfileirarEvento({
        uuid: uuidEvento, action: 'registrarEvento',
        payload: { eventoUuid: uuidEvento, idRota: rotaAtual.idRota, idPedido, tipoEvento: 'PEDIDO_ENTREGUE', timestampDispositivo: agora }
      });

      const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
      p.STATUS = 'ENTREGUE';
      document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      sincronizarFila();
    }

    function abrirFluxoNaoRealizada(idPedido) {
      const div = document.getElementById(`fluxo_${idPedido}`);
      const motivos = ['Cliente ausente', 'Fora do Horário', 'Pedido Errado', 'Recusado pelo cliente', 'Outros'];
      div.innerHTML = `
        <div class="card" style="margin-top:10px;">
          <label>Motivo</label>
          <select id="motivoSelect_${idPedido}" onchange="alternarCampoOutros('${idPedido}')">
            ${motivos.map(m => `<option value="${m}">${m}</option>`).join('')}
          </select>
          <div id="campoOutros_${idPedido}" style="display:none;">
            <label>Descreva o motivo</label>
            <input type="text" id="motivoOutros_${idPedido}">
          </div>
          <button class="btn-primario" onclick="confirmarNaoEntregue('${idPedido}')">Confirmar</button>
        </div>
      `;
    }

    function alternarCampoOutros(idPedido) {
      const select = document.getElementById(`motivoSelect_${idPedido}`);
      document.getElementById(`campoOutros_${idPedido}`).style.display = select.value === 'Outros' ? 'block' : 'none';
    }

    async function confirmarNaoEntregue(idPedido) {
      const select = document.getElementById(`motivoSelect_${idPedido}`);
      let motivo = select.value;
      if (motivo === 'Outros') {
        motivo = document.getElementById(`motivoOutros_${idPedido}`).value.trim() || 'Outros';
      }

      const uuidStatus = gerarUUID();
      await enfileirarEvento({
        uuid: uuidStatus, action: 'atualizarStatusPedido',
        payload: { idPedido, status: 'NAO_ENTREGUE', motivoNaoEntregue: motivo }
      });

      const uuidEvento = gerarUUID();
      const agora = new Date().toISOString();
      await enfileirarEvento({
        uuid: uuidEvento, action: 'registrarEvento',
        payload: { eventoUuid: uuidEvento, idRota: rotaAtual.idRota, idPedido, tipoEvento: 'PEDIDO_NAO_ENTREGUE', timestampDispositivo: agora, detalhe: { motivo } }
      });

      const p = pedidos.find(x => x.ID_PEDIDO === idPedido);
      p.STATUS = 'NAO_ENTREGUE';
      document.getElementById(`pedido_${idPedido}`).outerHTML = cardPedido(p);
      sincronizarFila();
    }

    // Redimensiona pra no máx. 1024px de largura e comprime em JPEG 70% -
    // essencial pra não lotar o IndexedDB com fotos grandes de celular.
    function comprimirImagemParaBase64(arquivo) {
      return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const escala = Math.min(1, 1024 / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * escala;
            canvas.height = img.height * escala;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
            resolve(dataUrl.split(',')[1]); // remove o prefixo "data:image/jpeg;base64,"
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        leitor.onerror = reject;
        leitor.readAsDataURL(arquivo);
      });
    }

    carregarRota();
  </script>
</body>
</html>
