<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Simples - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topo">Rota Simples</div>
  <div class="container" style="max-width: 380px; padding-top: 60px;">
    <div class="card">
      <h2 style="margin-top:0; color: var(--indigo); font-family:'Montserrat',sans-serif;">Entrar</h2>

      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username" autocapitalize="none">

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">

      <button class="btn-primario" id="btnEntrar" onclick="entrar()">Entrar</button>
      <div id="mensagemErro" class="erro-msg"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    // Se já tem sessão salva, pula direto pra tela certa
    const sessao = sessaoAtual();
    if (sessao) irParaTelaDoPerfil(sessao.perfil);

    async function entrar() {
      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = document.getElementById('btnEntrar');
      const msg = document.getElementById('mensagemErro');
      msg.textContent = '';

      if (!usuario || !senha) {
        msg.textContent = 'Preencha usuário e senha.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const resp = await chamarAPI('login', { usuario, senha });
        if (resp.ok) {
          salvarSessao({ usuario: resp.usuario, perfil: resp.perfil });
          irParaTelaDoPerfil(resp.perfil);
        } else {
          msg.textContent = resp.erro || 'Não foi possível entrar.';
        }
      } catch (e) {
        msg.textContent = 'Sem conexão. Verifique o sinal e tente novamente.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    function irParaTelaDoPerfil(perfil) {
      if (perfil === 'MOTORISTA') {
        location.href = 'motorista.html';
      } else {
        location.href = 'roteirizador.html'; // MASTER / CONTROLADOR
      }
    }
  </script>
</body>
</html>
