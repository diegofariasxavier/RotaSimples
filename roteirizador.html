<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota Simples - Roteirizador</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.45.1/apexcharts.min.js"></script>
</head>
<body>
  <div class="topo">
    <span style="display:flex; align-items:center; gap:10px;">
      <img src="assets/logo.png" alt="Logo" class="logo-topo">
      <span>Roteirizador</span>
    </span>
    <span style="display:flex; align-items:center; gap:16px;">
      <span id="nomeUsuarioLogado" style="font-weight:600; opacity:0.9;"></span>
      <span class="sair" onclick="encerrarSessao()">Sair</span>
    </span>
  </div>

  <div class="app-shell">
    <div class="sidebar">
      <div class="nav-item ativo" id="navCriar" onclick="mostrarAba('criar')"><i>➕</i> Nova rota</div>
      <div class="nav-item" id="navPainel" onclick="mostrarAba('painel')"><i>📊</i> Painel ao vivo</div>
      <div class="nav-item" id="navHistorico" onclick="mostrarAba('historico')"><i>🕘</i> Histórico</div>
      <div class="nav-item" id="navMotoristas" onclick="mostrarAba('motoristas')"><i>👤</i> Motoristas</div>
    </div>

    <div class="main-content">

      <!-- ==================== ABA: CRIAR ROTA ==================== -->
      <div id="painelCriar">
        <div class="card">
          <label>Motorista</label>
          <select id="selMotorista"></select>

          <label>Veículo</label>
          <select id="selVeiculo"></select>

          <label>Data da operação</label>
          <input type="date" id="inpData">
        </div>

        <div id="listaPedidosForm"></div>

        <div class="btn-mais" onclick="adicionarPedido()">+</div>

        <button class="btn-primario" onclick="salvarRota()">Salvar rota</button>
        <div id="msgCriar" class="erro-msg"></div>
      </div>

      <!-- ==================== ABA: PAINEL AO VIVO ==================== -->
      <div id="painelAoVivo" style="display:none;">
        <div class="stats-grid">
          <div class="stat-card"><p class="rotulo">Rotas hoje</p><p class="valor" id="statRotasHoje">0</p></div>
          <div class="stat-card"><p class="rotulo">Em andamento</p><p class="valor" id="statEmAndamento" style="color:var(--alerta);">0</p></div>
          <div class="stat-card"><p class="rotulo">Entregues</p><p class="valor" id="statEntregues" style="color:var(--sucesso);">0</p></div>
          <div class="stat-card"><p class="rotulo">Não entregues</p><p class="valor" id="statNaoEntregues" style="color:var(--erro);">0</p></div>
        </div>
        <div class="card">
          <div id="graficoResumo"></div>
        </div>
        <div id="listaRotasAtivas"></div>
      </div>

      <!-- ==================== ABA: HISTÓRICO / GERENCIAR ROTAS ==================== -->
      <div id="painelHistorico" style="display:none;">
        <div class="card">
          <div class="grid-2">
            <div>
              <label>De</label>
              <input type="date" id="historicoDataInicio">
            </div>
            <div>
              <label>Até</label>
              <input type="date" id="historicoDataFim">
            </div>
          </div>
          <button class="btn-primario" onclick="carregarHistorico()">Buscar</button>
        </div>
        <div id="listaHistorico"></div>
      </div>

      <!-- ==================== ABA: CADASTRAR MOTORISTAS ==================== -->
      <div id="painelMotoristas" style="display:none;">
        <div class="card">
          <label>Nome / login do motorista</label>
          <input type="text" id="novoLoginMotorista" placeholder="Ex: Motorista 4">
          <label>Senha</label>
          <input type="text" id="novaSenhaMotorista" placeholder="Ex: 1234">
          <button class="btn-primario" onclick="cadastrarMotorista()">Cadastrar motorista</button>
          <div id="msgMotorista" class="erro-msg"></div>
        </div>
        <div class="card">
          <strong>Motoristas cadastrados</strong>
          <div id="listaMotoristasCadastrados" style="margin-top:10px;"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const sessao = exigirSessao();
    document.getElementById('nomeUsuarioLogado').textContent = sessao ? sessao.usuario : '';
    let contadorPedidos = 0;
    let grafico = null;
    let motoristasCache = [];
    let veiculosCache = [];

    function formatarDataBR(dataStr) {
      const partes = String(dataStr).slice(0, 10).split('-');
      if (partes.length !== 3) return dataStr;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    async function iniciar() {
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('inpData').value = hoje;
      document.getElementById('historicoDataInicio').value = hoje;
      document.getElementById('historicoDataFim').value = hoje;

      const msg = document.getElementById('msgCriar');

      const motoristas = await chamarAPI('listarMotoristas', {});
      const selM = document.getElementById('selMotorista');
      if (motoristas.ok && motoristas.motoristas.length) {
        motoristasCache = motoristas.motoristas;
        motoristasCache.forEach(m => {
          selM.innerHTML += `<option value="${m.login}">${m.login}</option>`;
        });
      } else {
        msg.textContent = (msg.textContent ? msg.textContent + ' ' : '') + 'Não encontrei motoristas cadastrados (verifique a aba Usuários / perfil = MOTORISTA).';
      }

      const veiculos = await chamarAPI('listarVeiculos', {});
      const selV = document.getElementById('selVeiculo');
      if (veiculos.ok && veiculos.veiculos.length) {
        veiculosCache = veiculos.veiculos;
        veiculosCache.forEach(v => {
          selV.innerHTML += `<option value="${v.placa}">${v.placa}</option>`;
        });
      } else {
        msg.textContent = (msg.textContent ? msg.textContent + ' ' : '') + 'Não encontrei veículos cadastrados (verifique a aba Veiculos e o nome exato dela no Codigo.gs).';
      }

      adicionarPedido();
    }
    iniciar();

    function adicionarPedido() {
      contadorPedidos++;
      const id = contadorPedidos;
      const div = document.createElement('div');
      div.className = 'card';
      div.id = `pedidoForm${id}`;
      div.innerHTML = `
        <label>Número do pedido</label>
        <input type="text" id="numPedido${id}">
        <label>Nome do cliente</label>
        <input type="text" id="cliente${id}">
        <label>Endereço (rua, número, bairro, cidade/estado)</label>
        <input type="text" id="endereco${id}">
        <button class="btn-secundario" style="margin-top:10px; color:var(--erro); border-color:var(--erro)!important;" onclick="document.getElementById('pedidoForm${id}').remove()">Remover</button>
      `;
      document.getElementById('listaPedidosForm').appendChild(div);
    }

    async function salvarRota() {
      const motorista = document.getElementById('selMotorista').value;
      const veiculo = document.getElementById('selVeiculo').value;
      const data = document.getElementById('inpData').value;
      const msg = document.getElementById('msgCriar');
      msg.textContent = '';

      const pedidos = [];
      for (let i = 1; i <= contadorPedidos; i++) {
        const el = document.getElementById(`pedidoForm${i}`);
        if (!el) continue;
        const numeroPedido = document.getElementById(`numPedido${i}`).value.trim();
        const cliente = document.getElementById(`cliente${i}`).value.trim();
        const endereco = document.getElementById(`endereco${i}`).value.trim();
        if (numeroPedido && cliente && endereco) {
          pedidos.push({ numeroPedido, cliente, endereco });
        }
      }

      if (!motorista || !veiculo || !data || pedidos.length === 0) {
        msg.textContent = 'Preencha motorista, veículo, data e ao menos um pedido completo.';
        return;
      }

      try {
        const resp = await chamarAPI('criarRota', { motorista, veiculo, data, pedidos });
        if (resp.ok) {
          alert('Rota criada: ' + resp.idRota);
          location.reload();
        } else {
          msg.textContent = resp.erro || 'Erro ao salvar rota.';
        }
      } catch (e) {
        msg.textContent = 'Sem conexão. Tente novamente.';
      }
    }

    function mostrarAba(aba) {
      document.getElementById('painelCriar').style.display = aba === 'criar' ? 'block' : 'none';
      document.getElementById('painelAoVivo').style.display = aba === 'painel' ? 'block' : 'none';
      document.getElementById('painelHistorico').style.display = aba === 'historico' ? 'block' : 'none';
      document.getElementById('painelMotoristas').style.display = aba === 'motoristas' ? 'block' : 'none';

      ['navCriar', 'navPainel', 'navHistorico', 'navMotoristas'].forEach(id => document.getElementById(id).classList.remove('ativo'));
      const mapaNav = { criar: 'navCriar', painel: 'navPainel', historico: 'navHistorico', motoristas: 'navMotoristas' };
      document.getElementById(mapaNav[aba]).classList.add('ativo');

      if (aba === 'painel') carregarPainel();
      if (aba === 'historico') carregarHistorico();
      if (aba === 'motoristas') carregarListaMotoristas();
    }

    async function cadastrarMotorista() {
      const login = document.getElementById('novoLoginMotorista').value.trim();
      const senha = document.getElementById('novaSenhaMotorista').value.trim();
      const msg = document.getElementById('msgMotorista');
      msg.textContent = '';

      if (!login || !senha) {
        msg.textContent = 'Preencha o nome/login e a senha.';
        return;
      }

      try {
        const resp = await chamarAPI('cadastrarUsuario', { login, senha, perfil: 'MOTORISTA' });
        if (resp.ok) {
          document.getElementById('novoLoginMotorista').value = '';
          document.getElementById('novaSenhaMotorista').value = '';
          carregarListaMotoristas();
          document.getElementById('selMotorista').innerHTML += `<option value="${login}">${login}</option>`;
          motoristasCache.push({ login });
        } else {
          msg.textContent = resp.erro || 'Erro ao cadastrar.';
        }
      } catch (e) {
        msg.textContent = 'Sem conexão. Tente novamente.';
      }
    }

    async function carregarListaMotoristas() {
      const resp = await chamarAPI('listarMotoristasComSenha', {});
      const div = document.getElementById('listaMotoristasCadastrados');
      div.innerHTML = (resp.motoristas || []).map(m => {
        const senhaVisivel = m.senha && String(m.senha).length !== 64;
        return `
        <div class="linha-rota" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <strong>${m.login}</strong><br>
            <span style="font-size:13px; color:#666;">
              ${senhaVisivel ? 'Senha: ' + m.senha : 'Senha antiga protegida — redefina abaixo'}
            </span>
          </div>
          <button class="btn-secundario" style="width:auto; padding:8px 14px;" onclick="redefinirSenhaMotorista('${m.login}')">Redefinir senha</button>
        </div>
      `;
      }).join('') || '<p>Nenhum motorista cadastrado ainda.</p>';
    }

    async function redefinirSenhaMotorista(login) {
      const novaSenha = prompt(`Nova senha para ${login}:`);
      if (!novaSenha) return;
      const resp = await chamarAPI('redefinirSenha', { login, novaSenha });
      if (resp.ok) {
        carregarListaMotoristas();
      } else {
        alert(resp.erro || 'Erro ao redefinir senha.');
      }
    }

    function statusParaClasse(status) {
      return String(status).toLowerCase();
    }

    function linhaRota(r, comAcoes) {
      const totalConcluido = r.entregues + r.naoEntregues;
      const pct = r.totalPedidos ? Math.round((totalConcluido / r.totalPedidos) * 100) : 0;
      const podeEditar = comAcoes && r.statusGeral === 'NAO_INICIADA';

      return `
        <div class="linha-rota" id="linha_${r.idRota}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>Rota ${r.idRota}</strong> — ${r.motorista} — ${r.veiculo}
              <p style="margin:4px 0 0; font-size:13px; color:#666;">Data: ${formatarDataBR(r.data)}</p>
            </div>
            <span class="status-pill ${statusParaClasse(r.statusGeral)}">${r.statusGeral.replace('_',' ')}</span>
          </div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
            <span style="font-size:12px; color:#666; white-space:nowrap;">${totalConcluido}/${r.totalPedidos}</span>
          </div>
          <p style="margin:8px 0 0; font-size:12px; color:#888;">
            ${r.entregues} entregues · ${r.pendentes} pendentes · ${r.naoEntregues} não entregues
          </p>
          ${podeEditar ? `
            <div class="grid-2" style="margin-top:10px;">
              <button class="btn-secundario" onclick='abrirEdicaoRota(${JSON.stringify(r)})'>Editar</button>
              <button class="btn-secundario" style="color:var(--erro); border-color:var(--erro)!important;" onclick="cancelarRotaClick('${r.idRota}')">Cancelar rota</button>
            </div>
            <div id="edicao_${r.idRota}"></div>
          ` : ''}
        </div>
      `;
    }

    async function carregarPainel() {
      const resp = await chamarAPI('listarRotasAtivas', {});
      if (!resp.ok) return;

      const hoje = new Date().toISOString().split('T')[0];
      const rotasHoje = resp.rotas.filter(r => String(r.data).slice(0,10) === hoje);
      const emAndamento = resp.rotas.filter(r => r.statusGeral === 'EM_ANDAMENTO').length;
      const totalEntregues = resp.rotas.reduce((s, r) => s + r.entregues, 0);
      const totalNaoEntregues = resp.rotas.reduce((s, r) => s + r.naoEntregues, 0);

      document.getElementById('statRotasHoje').textContent = rotasHoje.length;
      document.getElementById('statEmAndamento').textContent = emAndamento;
      document.getElementById('statEntregues').textContent = totalEntregues;
      document.getElementById('statNaoEntregues').textContent = totalNaoEntregues;

      const seriesData = [totalEntregues, resp.rotas.reduce((s,r)=>s+r.pendentes,0), totalNaoEntregues];
      const categorias = ['Entregues', 'Pendentes', 'Não entregues'];

      const opcoesGrafico = {
        chart: { type: 'bar', height: 220, toolbar: { show: false } },
        series: [{ name: 'Pedidos', data: seriesData }],
        xaxis: { categories: categorias, axisBorder: { show: false }, axisTicks: { show: false } },
        yaxis: { show: false },
        grid: { show: false },
        dataLabels: { enabled: true, style: { fontSize: '13px', fontWeight: 700 } },
        legend: { show: false },
        colors: ['#22346a'],
        plotOptions: { bar: { columnWidth: '45%', borderRadius: 6 } }
      };

      if (!grafico) {
        grafico = new ApexCharts(document.querySelector('#graficoResumo'), opcoesGrafico);
        grafico.render();
      } else {
        grafico.updateOptions(opcoesGrafico);
      }

      const lista = document.getElementById('listaRotasAtivas');
      lista.innerHTML = resp.rotas.map(r => linhaRota(r, false)).join('') || '<p>Nenhuma rota criada ainda.</p>';
    }

    setInterval(() => {
      if (document.getElementById('painelAoVivo').style.display !== 'none') carregarPainel();
    }, 15000);

    async function carregarHistorico() {
      const dataInicio = document.getElementById('historicoDataInicio').value;
      const dataFim = document.getElementById('historicoDataFim').value;
      const resp = await chamarAPI('listarHistoricoRotas', { dataInicio, dataFim });
      const div = document.getElementById('listaHistorico');
      if (!resp.ok || !resp.rotas.length) {
        div.innerHTML = '<div class="card"><p>Nenhuma rota encontrada nesse período.</p></div>';
        return;
      }
      div.innerHTML = resp.rotas.map(r => linhaRota(r, true)).join('');
    }

    function abrirEdicaoRota(rota) {
      const div = document.getElementById(`edicao_${rota.idRota}`);
      div.innerHTML = `
        <div style="margin-top:10px; border-top:1px solid var(--cinza-borda); padding-top:10px;">
          <label>Motorista</label>
          <select id="editMotorista_${rota.idRota}">
            ${motoristasCache.map(m => `<option value="${m.login}" ${m.login === rota.motorista ? 'selected' : ''}>${m.login}</option>`).join('')}
          </select>
          <label>Veículo</label>
          <select id="editVeiculo_${rota.idRota}">
            ${veiculosCache.map(v => `<option value="${v.placa}" ${v.placa === rota.veiculo ? 'selected' : ''}>${v.placa}</option>`).join('')}
          </select>
          <label>Data</label>
          <input type="date" id="editData_${rota.idRota}" value="${String(rota.data).slice(0,10)}">
          <button class="btn-primario" onclick="salvarEdicaoRota('${rota.idRota}')">Salvar edição</button>
        </div>
      `;
    }

    async function salvarEdicaoRota(idRota) {
      const motorista = document.getElementById(`editMotorista_${idRota}`).value;
      const veiculo = document.getElementById(`editVeiculo_${idRota}`).value;
      const data = document.getElementById(`editData_${idRota}`).value;
      const resp = await chamarAPI('editarRota', { idRota, motorista, veiculo, data });
      if (resp.ok) {
        carregarHistorico();
      } else {
        alert(resp.erro || 'Erro ao editar rota.');
      }
    }

    async function cancelarRotaClick(idRota) {
      if (!confirm(`Cancelar a rota ${idRota}? Essa ação libera os números de pedido dela pra serem usados em outra rota.`)) return;
      const resp = await chamarAPI('cancelarRota', { idRota });
      if (resp.ok) {
        carregarHistorico();
      } else {
        alert(resp.erro || 'Erro ao cancelar rota.');
      }
    }
  </script>
</body>
</html>
